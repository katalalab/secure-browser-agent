name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-verify:
    # Windows-only path-separator failures stayed invisible while CI was ubuntu-only (#25).
    # The CLI emits paths into runs/ artifacts, so every supported OS has to be exercised.
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true

      - name: Show runtime
        run: |
          node --version
          npm --version

      - name: CI verify
        run: npm run verify:ci

  # Branch protection requires a check literally named "verify". Without this aggregate the
  # matrix would only publish "verify (ubuntu-latest)" and friends, and every PR would stay
  # blocked forever waiting for a context that no longer exists.
  verify:
    name: verify
    if: always()
    needs: matrix-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg to pass
        run: |
          result='${{ needs.matrix-verify.result }}'
          echo "matrix result: $result"
          test "$result" = "success"
