name: Verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-verify:
    # Windows-only path-separator failures stayed invisible while CI was ubuntu-only (#25), and
    # the same blind spot would return on a single self-hosted Linux runner. The CLI emits paths
    # into runs/ artifacts and resolves Chrome per platform, so every supported OS runs here.
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true

      - name: Show runtime
        run: |
          node --version
          npm --version

      # One test opens a headed browser, which needs a display. The Linux runner has none.
      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: CI verify
        # Chrome's sandbox cannot start in the Linux runner container. Scoped to CI so a
        # workstation never silently loses that boundary.
        env:
          SBA_CHROME_NO_SANDBOX: ${{ runner.os == 'Linux' && '1' || '' }}
        run: npm run verify:ci

  # Branch protection requires a check literally named "verify". Without this aggregate the
  # matrix would only publish "verify (ubuntu-latest)" and friends, and every PR would stay
  # blocked forever waiting for a context that no longer exists.
  verify:
    name: verify
    if: always()
    needs: matrix-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix leg to pass
        run: |
          result='${{ needs.matrix-verify.result }}'
          echo "matrix result: $result"
          test "$result" = "success"
